AWSTemplateFormatVersion: '2010-09-09'
Description: Lab 5 - Event-driven weekly report infrastructure

Parameters:
  ProjectName:
    Type: String
    Default: spry
  BackendImageUri:
    Type: String
    Description: ECR URI для Docker-образу бекенду
  VpcId:
    Type: AWS::EC2::VPC::Id
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  RouteTableIds:
    Type: List<String>
    Description: Route Tables для прив'язки S3 Gateway Endpoint
  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  RecipientEmail:
    Type: String
    Description: Email отримувача для SES Sandbox

Resources:
  # ------------------------------------------------------------
  # 1. S3 Bucket & VPC Gateway Endpoint
  # ------------------------------------------------------------
  ReportsBucket:
    Type: AWS::S3::Bucket
    DependsOn: MailerLambdaPermission
    Properties:
      BucketName: !Sub "${ProjectName}-reports-${AWS::AccountId}"
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldReports
            Status: Enabled
            ExpirationInDays: 90
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: "s3:ObjectCreated:*"
            Function: !GetAtt ReportMailerLambda.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: reports/
                  - Name: suffix
                    Value: .csv

  S3VPCEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds: !Ref RouteTableIds

  # ------------------------------------------------------------
  # 2. SQS Queue & Dead Letter Queue (DLQ)
  # ------------------------------------------------------------
  ReportsDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-report-requests-dlq"

  ReportsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-report-requests"
      VisibilityTimeout: 360 # 6x від timeout builder-лямбди (60s)
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ReportsDLQ.Arn
        maxReceiveCount: 3

  # ------------------------------------------------------------
  # 3. Report Builder Lambda (Усередині VPC)
  # ------------------------------------------------------------
  ReportBuilderRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: BuilderPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub "arn:aws:s3:::${ProjectName}-reports-${AWS::AccountId}/*"
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt ReportsQueue.Arn

  ReportBuilderLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-report-builder"
      PackageType: Image
      Code:
        ImageUri: !Ref BackendImageUri
      ImageConfig:
        Command: ["app.reports.lambda_handler.handler"]
      Timeout: 60
      MemorySize: 512
      Role: !GetAtt ReportBuilderRole.Arn
      VpcConfig:
        SecurityGroupIds:
          - !Ref SecurityGroupId
        SubnetIds: !Ref PrivateSubnetIds

  BuilderSQSEventMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      BatchSize: 1
      EventSourceArn: !GetAtt ReportsQueue.Arn
      FunctionName: !GetAtt ReportBuilderLambda.Arn

  # ------------------------------------------------------------
  # 4. EventBridge Scheduler (Щопонеділка о 07:00 Kyiv)
  # ------------------------------------------------------------
  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SendToSQS
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt ReportsQueue.Arn

  WeeklyReportSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub "${ProjectName}-weekly-report-schedule"
      ScheduleExpression: "cron(0 7 ? * MON *)"
      ScheduleExpressionTimezone: "Europe/Kyiv"
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt ReportsQueue.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"week": null, "source": "schedule"}'

  # ------------------------------------------------------------
  # 5. Report Mailer Lambda (Поза VPC) + SES
  # ------------------------------------------------------------
  ReportMailerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: MailerPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${ProjectName}-reports-${AWS::AccountId}/*"
              - Effect: Allow
                Action: ses:SendRawEmail
                Resource: "*"

  ReportMailerLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-report-mailer"
      Runtime: python3.11
      Handler: index.handler
      Role: !GetAtt ReportMailerRole.Arn
      Timeout: 30
      Environment:
        Variables:
          RECIPIENT_EMAIL: !Ref RecipientEmail
          SENDER_EMAIL: !Sub "reports@${ProjectName}.com"
      Code:
        ZipFile: |
          import os
          import boto3
          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText
          from email.mime.application import MIMEApplication

          s3 = boto3.client('s3')
          ses = boto3.client('sesv2')

          def handler(event, context):
              for record in event.get('Records', []):
                  bucket = record['s3']['bucket']['name']
                  key = record['s3']['object']['key']

                  # Завантаження CSV із S3
                  response = s3.get_object(Bucket=bucket, Key=key)
                  file_content = response['Body'].read()
                  filename = key.split('/')[-1]

                  # Формування листа
                  msg = MIMEMultipart()
                  msg['Subject'] = f"Weekly Report: {filename}"
                  msg['From'] = os.environ['SENDER_EMAIL']
                  msg['To'] = os.environ['RECIPIENT_EMAIL']

                  msg.attach(MIMEText("Вітаємо! Ваш тижневий звіт у додатку.", "plain"))

                  att = MIMEApplication(file_content)
                  att.add_header('Content-Disposition', 'attachment', filename=filename)
                  msg.attach(att)

                  # Відправка через SES
                  ses.send_email(
                      Content={'Raw': {'Data': msg.as_bytes()}}
                  )
              return {"statusCode": 200}

  MailerLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt ReportMailerLambda.Arn
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:aws:s3:::${ProjectName}-reports-${AWS::AccountId}"
